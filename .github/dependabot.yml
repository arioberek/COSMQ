version: 2
updates:
  # Keeps SHA-pinned actions current; Dependabot rewrites the SHA and version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # changesets/action v2 needs Changesets CLI v3; stay on v1 until the CLI is upgraded.
      - dependency-name: changesets/action
        update-types: ["version-update:semver-major"]
