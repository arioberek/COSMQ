name: Mobile release (GitHub macOS fallback)

# Normal releases use the EAS workflow in apps/mobile/.eas/workflows/release-ios.yml,
# which needs no token in GitHub. Use this only when the EAS build quota is used up;
# it requires an EXPO_TOKEN secret in the `app-store` environment.
#
# Manual only. Fork PRs can never reach this workflow or its secrets:
# - no pull_request / pull_request_target triggers
# - EXPO_TOKEN lives in the `app-store` environment, which only deploys from
#   `main` and requires a maintainer approval before any job starts.
on:
  workflow_dispatch:
    inputs:
      submit:
        description: Submit to App Store Connect (TestFlight) after the build
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

env:
  EAS_CLI: eas-cli@25.0.0

jobs:
  # Fallback when the EAS free quota (15 iOS builds/month) is used up.
  # Standard macOS runners are free on public repos, but these logs are PUBLIC:
  # never add steps that echo env, decode secrets, or upload the .ipa as an artifact.
  github-macos:
    name: iOS build (GitHub macOS, local)
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: app-store
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Signing credentials are fetched from EAS at build time and never written to the repo.
      - name: Build locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          bunx "$EAS_CLI" build --platform ios --profile production --non-interactive \
            --local --output "$RUNNER_TEMP/cosmq.ipa"

      - name: Submit to App Store Connect
        if: inputs.submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          bunx "$EAS_CLI" submit --platform ios --profile production --non-interactive \
            --path "$RUNNER_TEMP/cosmq.ipa"

      - name: Remove build output
        if: always()
        working-directory: ${{ runner.temp }}
        run: rm -f cosmq.ipa
